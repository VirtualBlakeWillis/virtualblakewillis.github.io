<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blake Willis</title>
    <!--
      Single Page Apps for GitHub Pages
      https://github.com/rafgraph/spa-github-pages

      This 404.html is served by GitHub Pages whenever it can't find a matching
      file for the requested path (e.g. a client-side route like /about).
      It encodes the intended path into a query string and redirects to the
      real index.html, where the inline script in index.html decodes it and
      restores the correct URL via history.replaceState before React Router
      mounts, so refreshing or deep-linking to any route works correctly.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
